<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Lyra Desktop — lyrics-first music player" />
    <meta name="theme-color" content="#09090b" />
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Lyra" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <title>Lyra</title>
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #09090b;
        color: #fafafa;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        transition: opacity 280ms cubic-bezier(0.16, 1, 0.3, 1), visibility 280ms cubic-bezier(0.16, 1, 0.3, 1);
        cursor: default;
      }
      #boot-splash[data-hidden="true"] {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #boot-splash .boot-core {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        text-align: center;
      }
      #boot-splash .boot-mark {
        font-size: 28px;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: rgba(250, 250, 250, 0.88);
      }
      #boot-splash .boot-status {
        font-size: 13px;
        color: rgba(250, 250, 250, 0.42);
        letter-spacing: 0.01em;
        min-height: 1.2em;
      }
      #root { min-height: 100%; }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-i18next": "https://aistudiocdn.com/react-i18next@^16.3.5",
    "i18next": "https://aistudiocdn.com/i18next@^25.6.3",
    "i18next-browser-languagedetector": "https://aistudiocdn.com/i18next-browser-languagedetector@^8.2.0"
  }
}
</script>
</head>
  <body>

    <div id="boot-splash" data-boot-revision="2026-07-27-minimal" role="status" aria-live="polite">
      <div class="boot-core">
        <div class="boot-mark">Lyra</div>
        <div class="boot-status" data-boot-status>Starting…</div>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Earliest possible splash clock — used for min-dwell so dismiss never races first paint.
      window.__lyraBootShownAt = (window.performance && performance.now) ? performance.now() : Date.now();
    </script>
    <script>
      (function bootMinimal() {
        var splash = document.getElementById('boot-splash');
        if (!splash) return;
        var statusNode = splash.querySelector('[data-boot-status]');
        if (statusNode && !statusNode.getAttribute('data-boot-locked')) {
          var isZh = String(navigator.language || '').toLowerCase().indexOf('zh') === 0;
          statusNode.textContent = isZh ? '正在启动…' : 'Starting…';
        }
      })();
    </script>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
