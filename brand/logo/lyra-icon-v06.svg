  <rect x="6" y="6" width="88" height="88" rx="22" fill="url(#lyraBg)"/>
  <!-- Bridging arc through stem tip -->
  <path d="M24 48c10-18 22-26 26-26 6 0 14 6 22 18" stroke="#FFF8F1" stroke-opacity="0.22" stroke-width="4" stroke-linecap="round"/>
  <g transform="translate(1.2 1.5)" opacity="0.12" fill="#000">
